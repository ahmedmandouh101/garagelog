# Replace garage.example.com, certificate paths and PHP socket for your host.
map $request_uri $garagelog_loggable {
    default 1;
    ~^/verify-email/ 0;
}
server {
    listen 80;
    server_name garage.example.com;
    return 301 https://garage.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name garage.example.com;
    ssl_certificate /etc/letsencrypt/live/garage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garage.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/garagelog/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;
    access_log /var/log/nginx/garagelog-access.log combined if=$garagelog_loggable;
    # Avoid writing signed verification queries to access logs.
    location /verify-email/ {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
