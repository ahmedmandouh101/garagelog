[program:garagelog-worker]
command=/usr/bin/php /var/www/garagelog/current/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/garagelog/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/garagelog-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
